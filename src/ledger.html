document.addEventListener("click",async ev=>{
  const t=ev.target.closest("[data-act]");if(!t)return;const a=t.dataset.act;
  if(a==="close-bg"&&ev.target!==t)return;
  if(a==="key"){pressKey(t.dataset.k);return}
  if(!["del","item-del","sub-del","p-del","tag-del","item-go","sub-go","part-go","acc-del"].includes(a))S.confirm=null;
  const D=S.draft,dp=D&&S.sheet&&S.sheet.part?D.parts.find(x=>x.id===S.sheet.part):null;
  switch(a){
    case "tab":S.tab=t.dataset.v;S.sheet=null;window.scrollTo(0,0);render();break;
    case "settings":openSettings();break;
    case "close":case "close-bg":goBack();break;
    case "add":readForm();openAdd({kind:t.dataset.kind,part:t.dataset.part,item:t.dataset.item,sub:t.dataset.sub,m:t.dataset.m});break;
    case "part":S.sheet={type:"part",part:t.dataset.part,m:t.dataset.m||null};render();break;
    case "pmonth":S.sheet={...S.sheet,m:t.dataset.m};render();break;
    case "past":S.pastOpen={...S.pastOpen,[t.dataset.part]:!S.pastOpen[t.dataset.part]};render();break;
    case "acct":S.sheet={type:"acct",acc:t.dataset.acc};render();break;
    case "rec":S.sheet={type:"rec",id:t.dataset.id,back:S.sheet};render();break;
    case "rfold":S.openRec={...S.openRec,[t.dataset.id]:!S.openRec[t.dataset.id]};render();break;
    case "gfold":{const k=t.dataset.key;S.fold={...S.fold,[k]:t.getAttribute("aria-expanded")!=="true"};render();break}
    case "ifold":S.openItem={...S.openItem,[t.dataset.key]:!S.openItem[t.dataset.key]};saveUi();render();break;
    case "ssel":S.selSub={...S.selSub,[t.dataset.key]:t.dataset.v};render();break;
    case "tsel":S.tagSel={...S.tagSel,[t.dataset.key]:t.dataset.v};render();break;
    case "msel":S.mSel=t.dataset.m;render();break;
    case "mopen":S.mOpen={...S.mOpen,[t.dataset.key]:!S.mOpen[t.dataset.key]};render();break;
    /* 记一笔 */
    case "save":doSave(t);break;
    case "edit":{const r=S.records.find(x=>x.id===t.dataset.id);if(r)openEdit(r);break}
    case "del":if(S.confirm!=="del:"+t.dataset.id){S.confirm="del:"+t.dataset.id;render();break}S.confirm=null;if(await delRecord(t.dataset.id)){toast("已删除");goBack()}break;
    case "f-kind":readForm();{const f=S.form,p=part(f.part);f.kind=t.dataset.v;f.err="";f.month=f.month||f.date.slice(0,7);if(f.kind==="out"&&!f.item){f.item=((p.items||[])[0]||{}).id||"";f.sub=firstSub(f)}f.account=lastAcct(p.id,f.kind)||f.account}render();break;
    case "f-part":readForm();{const f=S.form,p=part(t.dataset.v);f.part=p.id;f.item=((p.items||[])[0]||{}).id||"";f.sub=firstSub(f);f.tag="";f.account=lastAcct(p.id,f.kind)||f.account;f.err=""}render();break;
    case "f-month":readForm();S.form.month=t.dataset.v;render();break;
    case "f-item":readForm();S.form.item=t.dataset.v;S.form.sub=firstSub(S.form);render();break;
    case "f-sub":readForm();S.form.sub=t.dataset.v;render();break;
    case "f-tag":readForm();S.form.tag=t.dataset.v;render();break;
    case "f-acc":readForm();S.form.account=t.dataset.v;render();break;
    /* 设置 */
    case "settings-save":saveSettings();break;
    case "p-edit":S.sheet={type:"partEdit",part:t.dataset.part,back:{type:"settings"}};render();break;
    case "p-new":{const used=D.parts.map(p=>p.color),p={id:uid(),name:"新信封",color:COLORS.find(c=>!used.includes(c))||"e6",budget:0,cycleView:false,items:[],tags:[]};const ib=D.parts.findIndex(isInbox);D.parts.splice(ib<0?D.parts.length:ib,0,p);S.sheet={type:"partEdit",part:p.id,back:{type:"settings"}};render();break}
    case "cad":{const o=draftTarget(t.dataset);if(o){o.per=t.dataset.v;render()}break}
    case "i-edit":S.sheet={type:"itemEdit",part:S.sheet.part,item:t.dataset.item,back:{type:"partEdit",part:S.sheet.part,back:{type:"settings"}}};render();break;
    case "p-cview":dp.cycleView=!dp.cycleView;render();break;
    case "p-outside":dp.outside=!dp.outside;render();break;
    case "p-color":dp.color=t.dataset.v;render();break;
    case "cancel-del":S.confirm=null;render();break;
    case "p-del":{const mv=S.records.filter(r=>r.kind==="move"&&(keyPart(r.fromKey)===dp||keyPart(r.toKey)===dp)).length;
      if(mv){toast(`这个信封有 ${mv} 笔结转记录，先在详情里删掉它们`);break}
      if(S.confirm!=="part:"+dp.id){S.confirm="part:"+dp.id;render();break}
      D.parts=D.parts.filter(p=>p!==dp);S.sheet={type:"settings"};S.confirm=null;render();break}
    case "part-go":{const v=document.getElementById("ra-"+t.dataset.id).value.split(":");
      D.reassign.push({part:dp.id,item:null,sub:null,set:{part:v[1],item:"",sub:"",tag:""}});D.parts=D.parts.filter(p=>p!==dp);S.sheet={type:"settings"};S.confirm=null;render();break}
    case "item-new":{const id=uid();dp.items=[...(dp.items||[]),{id,name:"新项目",per:"c"}];S.sheet={type:"itemEdit",part:dp.id,item:id,back:{type:"partEdit",part:dp.id,back:{type:"settings"}}};render();break}
    case "item-del":{if(S.confirm!=="item:"+t.dataset.item){S.confirm="item:"+t.dataset.item;render();break}
      if(recsOf(dp.id,t.dataset.item).length)break;
      dp.items=dp.items.filter(i=>i.id!==t.dataset.item);S.confirm=null;S.sheet=S.sheet.type==="itemEdit"?S.sheet.back:S.sheet;render();break}
    case "item-go":{const v=document.getElementById("ra-"+t.dataset.id).value.split(":"),inb=D.parts.find(isInbox);
      D.reassign.push({part:dp.id,item:t.dataset.id,sub:null,set:v[0]==="inbox"?{part:inb.id,item:"",sub:"",tag:""}:{item:v[1],sub:""}});
      dp.items=dp.items.filter(i=>i.id!==t.dataset.id);S.confirm=null;S.sheet=S.sheet.type==="itemEdit"?S.sheet.back:S.sheet;render();break}
    case "sub-new":{const it=dp.items.find(i=>i.id===t.dataset.item),first=!(it.subs&&it.subs.length);it.subs=[...(it.subs||[]),{id:uid(),name:"新二级项目",budget:first?(it.budget??0):0}];delete it.budget;render();break}
    case "sub-del":{if(S.confirm!=="sub:"+t.dataset.sub){S.confirm="sub:"+t.dataset.sub;render();break}
      if(recsOf(dp.id,t.dataset.item,t.dataset.sub).length)break;
      const it=dp.items.find(i=>i.id===t.dataset.item);it.subs=(it.subs||[]).filter(s=>s.id!==t.dataset.sub);S.confirm=null;render();break}
    case "sub-go":{const v=document.getElementById("ra-"+t.dataset.id).value.split(":"),it=dp.items.find(i=>(i.subs||[]).some(s=>s.id===t.dataset.id));
      D.reassign.push({part:dp.id,item:it.id,sub:t.dataset.id,set:{sub:v[1]||""}});it.subs=it.subs.filter(s=>s.id!==t.dataset.id);S.confirm=null;render();break}
    case "tag-new":dp.tags=[...(dp.tags||[]),{id:uid(),name:"新标签"}];render();break;
    case "tag-del":{if(S.confirm!=="tag:"+t.dataset.tag){S.confirm="tag:"+t.dataset.tag;render();break}
      D.untag.push({part:dp.id,tag:t.dataset.tag});dp.tags=dp.tags.filter(x=>x.id!==t.dataset.tag);S.confirm=null;render();break}
    case "acc-new":D.accounts.push({name:"新账户",orig:null});render();break;
    case "acc-del":{if(S.confirm!=="acc:"+t.dataset.i){S.confirm="acc:"+t.dataset.i;render();break}S.confirm=null;const ac=D.accounts[+t.dataset.i],nm=ac.orig,n=nm?S.records.filter(r=>r.account===nm).length:0;
      if(n){toast(`${nm}有 ${n} 笔记录，不能删除，可以改名`);break}D.accounts.splice(+t.dataset.i,1);render();break}
  }
});
document.addEventListener("input",ev=>{
  const t=ev.target,ds=t.dataset||{};
  if(!ds.bind||!S.draft||t.tagName==="SELECT")return;
  const o=draftTarget(ds);if(!o)return;let v=t.value;
  if(ds.num){const raw=String(v).trim();
    if(raw===""&&ds.num==="opt")v=undefined;else{v=ds.num==="int"?parseInt(raw,10):parseFloat(raw);if(isNaN(v))v=0}
    if(v!==undefined&&ds.scale==="m")v=r2(v*dN());
    /* 联动另一个框 */
    if(ds.hint){const h=document.getElementById(ds.hint);if(h)h.textContent=v===undefined?"不填就只用来分类":ds.scale==="m"?"整个周期 "+fmt(v):"每月 "+fmt(v/dN())}
    if(ds.pair)document.querySelectorAll(`[data-pair="${ds.pair}"]`).forEach(el=>{if(el!==t)el.value=v===undefined?"":num2(el.dataset.scale==="m"?v/dN():v)});
  }
  if(v===undefined)delete o[ds.f];else o[ds.f]=v;
});
document.addEventListener("change",ev=>{
  const t=ev.target,ds=t.dataset||{};
  if(ds.bind&&S.draft&&t.tagName==="SELECT"){const o=draftTarget(ds);if(o)o[ds.f]=t.value;render()}
});
const KEYMAP={"*":"×","x":"×","/":"÷","-":"−","+":"+","=":"=",".":".","Backspace":"⌫","Delete":"C"};
document.addEventListener("keydown",ev=>{
  const tg=ev.target,typing=tg&&["INPUT","TEXTAREA","SELECT"].includes(tg.tagName);
  if(ev.key==="Escape"&&S.sheet){goBack();return}
  if(S.sheet&&S.sheet.type==="add"&&!typing&&!ev.metaKey&&!ev.ctrlKey&&!ev.altKey){
    if(/^[0-9]$/.test(ev.key)){ev.preventDefault();pressKey(ev.key);return}
    if(KEYMAP[ev.key]){ev.preventDefault();pressKey(KEYMAP[ev.key]);return}
    if(ev.key==="Enter"){ev.preventDefault();doSave(null)}
  }
});

/* 首页：票（保留票的样子，用水彩晕染） */
function vHome(){
  const m=curMonth(),mon=parts().filter(p=>byMonth(p)&&!p.outside),n=inboxCount(),inb=parts().find(isInbox);
  return `<div class="desk">${mon.map((p,i)=>ticket(p,m,i)).join("")||`<p class="none">没有按月显示的信封</p>`}

function ticket(p,m,i){
  const s=stat(p,m),pct=s.budget?Math.min(100,s.spent/s.budget*100):0;
  return `<button class="tk ${DARK_INK[p.color]?"ink":""} ${s.main<0?"over":""}" style="${cvar(p)}" data-act="part" data-part="${p.id}" data-m="${m}">
    <span class="tk-wash" aria-hidden="true"></span><span class="tk-frame" aria-hidden="true"></span>
    <span class="tk-top"><span class="tk-n">${esc(p.name)}</span><span class="tk-stamp">${ml(m)}</span></span>
    <span class="tk-l">${s.main<0?"超出":"还剩"}</span><span class="tk-big">${fmt(Math.abs(s.main))}</span>
    <span class="tk-perf"></span>
    <span class="tk-bot"><span>预算 ${fmt(s.budget)}</span><span>已花 ${fmt(s.spent)}</span></span>
    <span class="tk-bar"><i style="width:${pct.toFixed(1)}%"></i></span>${diffLine(s)}</button>`;
}

const artSvg=k=>`<svg class="ab-art" viewBox="0 0 60 60" aria-hidden="true">${AC_ART[k]}</svg>`;
function acGroups(){const gs=[];S.config.accounts.forEach((a,i)=>{const [g,sub]=a.includes("~")?a.split("~"):[null,a];
  if(g){let x=gs.find(y=>y.g===g);if(!x)gs.push(x={g,items:[]});x.items.push({a,sub,i})}else gs.push({a,i})});return gs}
const SPINE=`<span class="ab-spine" aria-hidden="true"><i></i></span><span class="ab-blob" aria-hidden="true"></span>`;
function vAccts(){
  const tot=r2(S.config.accounts.reduce((s,a)=>s+acctFlow(a).net,0)),gs=acGroups();
  const book=({a,i})=>{const f=acctFlow(a),empty=!f.rs.length;
    return `<button class="ab ${empty?"empty":""}" style="${acTone(i)}" data-act="acct" data-acc="${esc(a)}">${SPINE}${artSvg(acArt(a))}
      <span class="ab-txt"><b class="ab-n">${esc(a)}</b><span class="ab-v ${f.net<0?"neg":""}">${fmt(f.net)}</span>
      <span class="ab-s">${empty?"还没有进出":`进 ${fmt(f.inn)} · 出 ${fmt(f.out)}`}</span></span></button>`};
  const pouch=(x,k)=>{const t=r2(x.items.reduce((s,y)=>s+acctFlow(y.a).net,0));
    return `<div class="ab ab-g" style="--c:var(--play)">${SPINE}${artSvg("pouch")}
      <span class="ab-txt"><b class="ab-n">${esc(x.g)}</b><span class="ab-v">${fmt(t)}</span></span>
      <span class="ab-slips">${x.items.map(y=>{const f=acctFlow(y.a);return `<button class="ab-slip" style="${acTone(y.i)}" data-act="acct" data-acc="${esc(y.a)}"><span>${esc(y.sub)}</span><b class="${f.net<0?"neg":""}">${fmt(f.net)}</b></button>`}).join("")}</span></div>`};
  return `<div class="desk"><div class="ab-sum"><span>手上一共</span><b>${fmt(tot)}</b></div>
    <div class="abl">${gs.map((x,k)=>x.g?pouch(x,k):book(x)).join("")}</div></div>`;
}
function acctSheet(){
  const a=S.sheet.acc,f=acctFlow(a),i=S.config.accounts.indexOf(a),nm=a.includes("~")?a.split("~"):[null,a];
  const groups=[];for(const r of sorted(f.rs)){const m=String(r.date||r.month).slice(0,7);let g=groups.find(x=>x.m===m);if(!g)groups.push(g={m,rs:[]});g.rs.push(r)}
  return `<div class="sh-head"><h3>${esc(nm[1])}</h3>${closeBtn()}</div>

/* ===== v35 首页的票、账单的小票：和信封、存折同一张纸 ===== */
const miniArt=p=>`<svg class="mart" viewBox="0 0 60 60" aria-hidden="true">${artOf(p)}</svg>`;
function ticket(p,m,i){
  const s=stat(p,m),f=s.budget?Math.max(0,Math.min(1,s.spent/s.budget)):0,over=s.main<0;
  return `<button class="tq ${over?"over":""}" style="${cvar(p)}" data-act="part" data-part="${p.id}" data-m="${m}">
    <span class="tq-blob" aria-hidden="true"></span>${miniArt(p).replace('class="mart"','class="tq-art"')}
    <span class="pv-mark tq-mark"><span>${cnMonth(m)}</span></span>
    <span class="tq-main"><b class="tq-n">${esc(p.name)}</b><span class="tq-l">${over?"超出":"还剩"}</span><span class="tq-big">${fmt(Math.abs(s.main))}</span></span>
    <span class="tq-perf" aria-hidden="true"></span>
    <span class="tq-foot"><span class="tq-io">预算 <b>${fmt(s.budget)}</b>　已花 <b>${fmt(s.spent)}</b></span>${s.hasB&&Math.abs(s.diff)>=.005?`<span class="tq-diff ${s.diff>0?"up":"down"}">真实${s.diff>0?"多":"少"} ${fmt(Math.abs(s.diff))}</span>`:""}</span>
    <span class="pv-bar2 tq-bar"><i style="width:${(f*100).toFixed(1)}%"></i></span></button>`;
}
function vBills(){
  const ms=cycleMonths(),cur=curMonth(),sel=S.mSel&&ms.includes(S.mSel)?S.mSel:cur,st=monthTotals(sel);
  const line=(x,kind)=>{const key=sel+"|"+kind+"|"+x.id,open=!!S.mOpen[key],recs=kind==="out"?x.outs:x.ins,val=kind==="out"?x.spent:sum(x.ins);
    if(!recs.length&&(kind==="in"||!x.budget))return "";const over=kind==="out"&&x.budget&&x.spent>x.budget+.004,f=x.budget?Math.min(1,x.spent/x.budget):0;
    return `<div class="bq ${open?"open":""} ${over?"over":""}" style="${cvar(x.p)}"><button class="bq-l" data-act="mopen" data-key="${esc(key)}" aria-expanded="${open}">
      ${miniArt(x.p)}<span class="bq-n">${esc(x.p.name)}<small>${recs.length} 笔</small></span><span class="bq-d"></span><span class="bq-v ${over?"neg":""}">${kind==="in"?"+":""}${fmt(val)}</span></button>
      ${kind==="out"&&x.budget?`<div class="bq-sub"><span class="pv-bar2 bq-bar"><i style="width:${(f*100).toFixed(1)}%"></i></span><span>预算 ${fmt(x.budget)}，${over?`<b class="neg">超出 ${fmt(x.spent-x.budget)}</b>`:`还剩 ${fmt(x.budget-x.spent)}`}</span></div>`:""}
      ${open?`<ul class="bq-recs">${recs.map(r=>`<li><button data-act="rec" data-id="${esc(r.id)}"><span>${esc(String(r.date).slice(5).replace("-","/"))}</span><span>${esc(recTitle(r))}${r.tag&&tagName(x.p,r.tag)?`<small>${esc(tagName(x.p,r.tag))}</small>`:""}</span><span>${kind==="in"?"+":"−"}${fmt(r.amount)}</span></button></li>`).join("")}</ul>`:""}</div>`};
  const outs=st.g.map(x=>line(x,"out")).join(""),ins=st.g.map(x=>line(x,"in")).join("");
  return `<div class="desk"><div class="bst">${ms.map(m=>`<button class="bs ${m===sel?"on":""} ${m>cur?"future":""} ${m<cur?"past":""}" data-act="msel" data-m="${m}" aria-pressed="${m===sel}"><b>${cnMonth(m)}</b><span>${fmt(monthTotals(m).exp)}</span></button>`).join("")}</div>
  <article class="rq"><header class="rq-h"><h2>${cnMonth(sel)}</h2><span class="pv-mark rq-mark"><span>${sel===cur?"本月":sel<cur?"已过":"未到"}</span></span></header>
    <div class="rq-sum"><span><i>收入</i><b class="pos">+${fmt(st.inc)}</b></span><span><i>支出</i><b>−${fmt(st.exp)}</b></span><span><i>结余</i><b class="${st.inc-st.exp<0?"neg":""}">${fmt(st.inc-st.exp)}</b></span></div>
    <div class="rq-cap">支 出</div>${outs||`<p class="lg-none">这个月还没有支出</p>`}
    <div class="rq-cap">收 入</div>${ins||`<p class="lg-none">没有收入</p>`}
  </article></div>`;
}
/* 首页「最近记的」：一页手账，按天记，前面是信封的小画 */
function vHome(){
  const m=curMonth(),mon=parts().filter(p=>byMonth(p)&&!p.outside),n=inboxCount(),inb=parts().find(isInbox);
  const recent=sorted(S.records.filter(r=>r.kind!=="move")).slice(0,8),days=[];
  for(const r of recent){let d=days.find(x=>x.d===r.date);if(!d)days.push(d={d:r.date,rs:[]});d.rs.push(r)}
  const wd=d=>{const [y,mm,dd]=String(d).split("-").map(Number);return y?"周"+WD[new Date(y,mm-1,dd).getDay()]:""};
  const row=r=>{const p=part(r.part),tg=r.kind==="out"?tagName(p,r.tag):"",sign=r.kind==="in"?"+":"−";

  return `<div class="desk">${mon.map((p,i)=>ticket(p,m,i)).join("")||`<p class="none">没有按月显示的信封</p>`}

}
